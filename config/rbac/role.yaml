---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds/finalizers
  verbs:
  - update
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  verbs:
  - get
  - list
  - watch
