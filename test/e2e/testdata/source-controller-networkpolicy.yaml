# Flux's default NetworkPolicies only let pods in flux-system reach source-controller.
# This policy lets build pods in any namespace download artifacts, as the Helm chart's optional policy will.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-image-builds
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: image-build-controller
      ports:
        - protocol: TCP
          port: http
