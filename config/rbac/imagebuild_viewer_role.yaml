# This rule is not used by the project image-build-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to build.fluxcd.leightweight.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: image-build-controller
    app.kubernetes.io/managed-by: kustomize
  name: imagebuild-viewer-role
rules:
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds/status
  verbs:
  - get
