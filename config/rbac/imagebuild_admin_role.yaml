# This rule is not used by the project image-build-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over build.fluxcd.leightweight.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: image-build-controller
    app.kubernetes.io/managed-by: kustomize
  name: imagebuild-admin-role
rules:
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds
  verbs:
  - '*'
- apiGroups:
  - build.fluxcd.leightweight.io
  resources:
  - imagebuilds/status
  verbs:
  - get
