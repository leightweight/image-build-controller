name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.7
      - run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.7
      - run: mise run test

  test-e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.7
      - run: mise run test:e2e

  # Temporary: find out why user namespace pods fail on this runner.
  userns-diagnose:
    name: User namespace diagnostics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.7
      - name: Host
        run: |
          set -x
          uname -a
          head -3 /etc/os-release
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces || true
          findmnt -R /sys
          docker info
      - name: kind node
        run: |
          set -x
          kind create cluster --name diag
          docker exec diag-control-plane sh -c 'uname -r; findmnt -R /sys; containerd --version; runc --version; cat /proc/self/attr/current'
      - name: User namespace pod
        run: |
          pod() {
            kubectl delete pod "$1" --ignore-not-found --wait
            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: $1
          spec:
            hostUsers: false
            containers:
              - name: sleep
                image: busybox:1.37
                command: ["sleep", "3600"]
          EOF
            kubectl wait "pod/$1" --for=condition=Ready --timeout=90s || kubectl describe pod "$1" | tail -5
          }
          pod userns-default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          pod userns-no-apparmor-restriction
          sudo aa-status | head -5 || true
